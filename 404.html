<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">

  <title>Page Not Found — CodeIn4K</title>
  <meta name="description" content="The page you're looking for doesn't exist. Browse all CodeIn4K programming tutorials instead.">

  <link rel="canonical" href="https://www.codein4k.com/">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2313A1E9'/><text y='.9em' font-size='60' x='10' fill='white' font-family='monospace' font-weight='bold'>C4</text></svg>">

  <script>
    (function(){
      var t=localStorage.getItem('codein4k_theme')||'light';
      document.documentElement.setAttribute('data-theme',t);
    })();
  </script>

  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="/assets/css/components.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--sp-8);
    }

    .notfound {
      text-align: center;
      max-width: 520px;
    }

    .notfound-code {
      font-family: var(--font-mono);
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: var(--fw-black);
      letter-spacing: -0.06em;
      line-height: 1;
      background: linear-gradient(135deg, var(--clr-primary), var(--clr-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: var(--sp-4);
      display: block;
    }

    .notfound-title {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: var(--fw-bold);
      letter-spacing: -0.03em;
      margin-bottom: var(--sp-3);
    }

    .notfound-desc {
      font-size: var(--text-base);
      color: var(--text-secondary);
      line-height: var(--lh-relaxed);
      margin-bottom: var(--sp-8);
    }

    .notfound-actions {
      display: flex;
      gap: var(--sp-4);
      justify-content: center;
      flex-wrap: wrap;
    }

    .notfound-hint {
      margin-top: var(--sp-10);
      font-family: var(--font-mono);
      font-size: var(--text-sm);
      color: var(--text-muted);
    }

    .notfound-hint span { color: var(--clr-primary); }
  </style>
</head>
<body>

  <div class="notfound">
    <strong class="notfound-code">404</strong>

    <h1 class="notfound-title">Page not found</h1>
    <p class="notfound-desc">
      This URL doesn't exist. Maybe it was deleted, moved, or you mistyped it.
      Browse the video library to find what you need.
    </p>

    <div class="notfound-actions">
      <a href="/" class="btn btn-primary btn-lg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Home
      </a>
      <a href="/videos" class="btn btn-outline btn-lg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Browse Videos
      </a>
    </div>

    <p class="notfound-hint">
      // <span>codein4k.com</span> — a powerful dose of learning
    </p>
  </div>

  <script src="/assets/js/theme.js"></script>
</body>
</html>
